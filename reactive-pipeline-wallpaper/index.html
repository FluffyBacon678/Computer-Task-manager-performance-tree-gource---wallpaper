<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reactive Pipeline</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #020309;
      }

      body {
        font-family: "Cascadia Mono", Consolas, monospace;
        user-select: none;
      }

      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      #hud {
        position: fixed;
        top: 14px;
        right: 16px;
        z-index: 5;
        display: none;
        color: rgba(218, 246, 255, 0.92);
        font: 12px/1.45 "Cascadia Mono", Consolas, monospace;
        text-align: right;
        text-shadow: 0 0 8px rgba(45, 212, 255, 0.42);
        pointer-events: none;
      }

      #hud-title {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 2px;
        color: #f4fbff;
      }

      #hud-status,
      #hud-load {
        opacity: 0.82;
      }

      #file-mode-warning {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: none;
        place-items: center;
        padding: 32px;
        color: #d7f6ff;
        background: #03040a;
        font: 15px/1.55 "Cascadia Mono", Consolas, monospace;
        text-align: center;
      }

      body.show-file-warning #file-mode-warning {
        display: grid;
      }

      #file-mode-warning strong {
        display: block;
        margin-bottom: 10px;
        color: #fff;
        font-size: 20px;
        font-weight: 700;
      }

      #file-mode-warning code {
        display: inline-block;
        margin: 6px 0;
        padding: 4px 7px;
        color: #ffffff;
        background: rgba(0, 200, 255, 0.13);
        border: 1px solid rgba(0, 200, 255, 0.22);
        border-radius: 4px;
      }
    </style>
    <script>
      (() => {
        const path = window.location.pathname.replace(/\\/g, '/').toLowerCase();
        const isSourceFileOpen =
          window.location.protocol === 'file:' &&
          path.endsWith('/reactive-pipeline-wallpaper/index.html') &&
          !path.includes('/dist/');

        if (isSourceFileOpen) {
          window.addEventListener('DOMContentLoaded', () => {
            document.body.classList.add('show-file-warning');
          });
        }
      })();
    </script>
  </head>
  <body>
    <div id="file-mode-warning">
      <div>
        <strong>Reactive Pipeline needs the Vite dev server or packaged dist build.</strong>
        For browser testing run <code>npm.cmd run dev</code> and open <code>http://127.0.0.1:5192/</code>.<br />
        For Wallpaper Engine run <code>npm.cmd run package</code> and import <code>dist/index.html</code>.
      </div>
    </div>
    <div id="hud">
      <div id="hud-title">REACTIVE PIPELINE</div>
      <div id="hud-status">TELEMETRY --</div>
      <div id="hud-load">LOAD --%</div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
